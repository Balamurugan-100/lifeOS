name: lifeos_app
description: "LifeOS - a mobile-first personal operating system."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  drift: ^2.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.0.0
  lifeos_core:
    path: ../packages/core
  lifeos_export:
    path: ../packages/export
  lifeos_finance:
    path: ../packages/domains/finance
  lifeos_habits:
    path: ../packages/domains/habits
  lifeos_storage:
    path: ../packages/storage
  lifeos_tasks:
    path: ../packages/domains/tasks
  lifeos_journal:
    path: ../packages/domains/journal
  lifeos_focus:
    path: ../packages/domains/focus
  lifeos_goals:
    path: ../packages/domains/goals
  lifeos_notes:
    path: ../packages/domains/notes
  lifeos_gamification:
    path: ../packages/domains/gamification
  lifeos_rituals:
    path: ../packages/domains/rituals
  lifeos_planner:
    path: ../packages/domains/planner
  lifeos_wellness:
    path: ../packages/domains/wellness
  lifeos_review:
    path: ../packages/domains/review
  path: ^1.8.0
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_markdown: ^0.7.7+1
  crypto: ^3.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true